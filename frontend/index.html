<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Judul & favicon di sini hanya nilai awal sebelum aplikasi termuat.
         Keduanya langsung ditimpa oleh merek yang tersimpan di database —
         lihat frontend/src/context/BrandingContext.jsx. Favicon-nya lencana
         "Z + Shield + Padlock" ZASETA yang SUNGGUHAN (dipotong jadi persegi
         dari public/brand/zaseta-icon.png, lihat catatan di komponen di atas
         yang membuatnya) — bukan gambar gembok buatan sendiri. -->
    <title>ZASETA — Asset Management System</title>
    <meta name="description" content="ZASETA — sistem manajemen aset. Tercatat rapi dan aman: mencatat, memindahkan, dan menelusuri seluruh aset perusahaan dari satu tempat." />

    <link rel="icon" type="image/png" sizes="32x32" href="/brand/zaseta-favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/zaseta-favicon-64.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="/brand/zaseta-favicon-256.png" />
    <link rel="apple-touch-icon" href="/brand/zaseta-favicon-256.png" />
    <meta name="theme-color" content="#1c6433" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Lato untuk seluruh antarmuka (varian Black dipakai khusus untuk judul &
         angka besar, tegak — tidak ada teks miring/italic di aplikasi ini);
         JetBrains Mono khusus kode aset & nomor seri, karena angka/huruf yang
         mirip (0 vs O, 1 vs l) harus mudah dibedakan. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
