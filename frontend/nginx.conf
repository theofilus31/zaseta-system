# Fallback ke index.html untuk semua path yang tidak cocok berkas fisik --
# WAJIB untuk React Router (mode BrowserRouter): tanpa ini, refresh manual
# di URL seperti /assets/123 akan dibalas 404 oleh Nginx alih-alih
# menyerahkan routing-nya ke React di sisi klien.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Aset dengan hash di nama berkas (bawaan Vite) aman di-cache lama.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
